<!DOCTYPE html>  
<html lang="zh-CN">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>iOS 26 壁纸预览工具</title>  
    
  <script src="https://cdn.tailwindcss.com"></script>  
    
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>  
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>  
    
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  
  
  <style>  
    @import url('https://fonts.cdnfonts.com/css/sf-pro-display');  
    body {  
      margin: 0;  
      padding: 0;  
      background-color: #ffffff;  
    }  
    @keyframes fadeIn {  
      from { opacity: 0; }  
      to { opacity: 1; }  
    }  
    .animate-fade-in {  
      animation: fadeIn 0.3s ease-in-out;  
    }  
  </style>  
</head>  
<body>  
  <div id="root"></div>  
  
  <script type="text/babel">  
    const { useState, useEffect, useRef } = React;  
  
    const UploadIcon = () => (  
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">  
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>  
        <polyline points="17 8 12 3 7 8"></polyline>  
        <line x1="12" y1="3" x2="12" y2="15"></line>  
      </svg>  
    );  
  
    // --- 安全的默认 Base64 资源，已在底层 SVG 代码中注入了绝对宽高防爆 ---  
    const TRANSPARENT_PIXEL = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";  
    const DEFAULT_SIGNAL = "data:image/svg+xml;charset=utf-8,%3Csvg width='17' height='11' viewBox='0 0 17 11' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='7' width='3' height='4' rx='1'/%3E%3Crect x='4.5' y='4.5' width='3' height='6.5' rx='1'/%3E%3Crect x='9' y='2' width='3' height='9' rx='1'/%3E%3Crect x='13.5' y='0' width='3' height='11' rx='1'/%3E%3C/svg%3E";  
    const DEFAULT_WIFI = "data:image/svg+xml;charset=utf-8,%3Csvg width='16' height='12' viewBox='0 0 16 12' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 12C8.5 12 9 11.5 9 11C9 10.4 8.5 10 8 10C7.4 10 7 10.4 7 11C7 11.5 7.4 12 8 12Z'/%3E%3Cpath d='M4 8.5C6.2 6.6 9.8 6.6 12 8.5' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M1.5 5.5C5 2.5 10.9 2.5 14.5 5.5' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E";  
    const DEFAULT_BATTERY = "data:image/svg+xml;charset=utf-8,%3Csvg width='28' height='14' viewBox='-1 -0.5 28 14' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='none' stroke='white' stroke-opacity='0.4' stroke-width='1' d='M5.4 0L19.5 0C21.3 0 22 0.2 22.8 0.5C23.5 0.9 24 1.4 24.4 2.1C24.8 2.9 25 3.6 25 5.4L25 7.5C25 9.3 24.8 10 24.4 10.8C24 11.5 23.5 12 22.8 12.4C22 12.8 21.3 13 19.5 13L5.4 13C3.6 13 2.9 12.8 2.2 12.4C1.5 12 0.9 11.5 0.5 10.8C0.2 10 0 9.3 0 7.5L0 5.4C0 3.6 0.2 2.9 0.5 2.1C0.9 1.4 1.5 0.9 2.2 0.5C2.9 0.2 3.6 0 5.4 0Z'/%3E%3Crect x='1.8' y='1.8' width='19' height='9.4' rx='2.5'/%3E%3Cpath d='M25.5 4.5v4a2 2 0 000-4z' fill-opacity='0.4'/%3E%3C/svg%3E";  
  
    const getImageDimensions = (url) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.width, height: img.height });
        img.onerror = reject;
        img.src = url;
      });
    };

    const calculateOptimalScale = (imgWidth, imgHeight) => {
      const containerWidth = 393;
      const containerHeight = 852;
      const imgRatio = imgWidth / imgHeight;
      const containerRatio = containerWidth / containerHeight;
      
      let scale = 100;
      if (imgRatio > containerRatio) {
        scale = (containerHeight * imgRatio / containerWidth) * 100;
      } else {
        scale = 100;
      }
      return Math.max(100, Math.ceil(scale));
    };

    // --- 本地原图映射 ---  
    const HOME_APPS = [  
      { id: 'facetime', name: 'FaceTime', img: 'facetime-iOS-Default.png' },  
      { id: 'calendar', name: 'Calendar', img: 'calendar-iOS-Default.png' },  
      { id: 'photos', name: 'Photos', img: 'photos-iOS-Default.png' },  
      { id: 'camera', name: 'Camera', img: 'camera-iOS-Default.png' },  
      { id: 'mail', name: 'Mail', img: 'mail-iOS-Default.png' },  
      { id: 'notes', name: 'Notes', img: 'notes-iOS-Default.png' },  
      { id: 'reminders', name: 'Reminders', img: 'reminders-iOS-Default.png' },  
      { id: 'clock', name: 'Clock', img: 'clock-iOS-Default.png' },  
    ];  
  
    const DOCK_APPS = [  
      { id: 'facetime', name: 'FaceTime', img: 'facetime-iOS-Default.png' },  
      { id: 'mail', name: 'Mail', img: 'mail-iOS-Default.png' },  
      { id: 'photos', name: 'Photos', img: 'photos-iOS-Default.png' },  
      { id: 'clock', name: 'Clock', img: 'clock-iOS-Default.png' },  
    ];  
  
    const DEFAULT_LOCK_WP = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop";  
    const DEFAULT_HOME_WP = "https://images.unsplash.com/photo-1557672172-298e090bd0f1?q=80&w=2487&auto=format&fit=crop";  
  
    const getIconStyle = (isDark, isActive) => {  
      if (!isDark && !isActive) return { mixBlendMode: 'screen', filter: 'none' };  
      if (!isDark && isActive) return { mixBlendMode: 'multiply', filter: 'invert(1)' };  
      if (isDark && !isActive) return { mixBlendMode: 'multiply', filter: 'invert(1)' };  
      if (isDark && isActive) return { mixBlendMode: 'screen', filter: 'none' };  
    };  
  
    const SliderControl = ({ label, value, min, max, step, onChange }) => (  
      <div className="flex flex-col gap-1">  
        <div className="flex justify-between text-[11px] text-[#8e8e93]"><span>{label}</span><span>{value}</span></div>  
        <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} className="accent-[#007aff] h-[3px] cursor-pointer" />  
      </div>  
    );  
  
    // --- 状态栏渲染器：回归标准，抛弃所有可能消失的嵌套，纯 img 标签渲染 ---  
    const StatusBarIcons = ({ theme, iconMap, bat }) => {  
      const sigW = Math.round(bat.signal * 1.54 * 10) / 10;  
      const wifiW = Math.round(bat.wifi * 1.33 * 10) / 10;  
      const batW = Math.round(bat.height * 2.1 * 10) / 10;  
        
      const sigSrc = iconMap['Cellular Connection.svg'] || 'Cellular Connection.svg';  
      const wifiSrc = iconMap['Wifi.svg'] || 'Wifi.svg';  
      const batSrc = iconMap['资源 1.svg'] || '资源 1.svg';  
  
      return (  
        <div className="flex items-center gap-[6.5px] transition-all" style={{ filter: theme === 'black' ? 'invert(1)' : 'none' }}>  
          <img src={sigSrc} alt="Signal" style={{ width: `${sigW}px`, height: `${bat.signal}px`, objectFit: 'contain', flexShrink: 0, display: 'block' }} onError={(e) => { e.target.src = DEFAULT_SIGNAL; }} />  
          <img src={wifiSrc} alt="WiFi" style={{ width: `${wifiW}px`, height: `${bat.wifi}px`, objectFit: 'contain', flexShrink: 0, display: 'block' }} onError={(e) => { e.target.src = DEFAULT_WIFI; }} />  
          <img src={batSrc} alt="Battery" className="z-20" style={{ width: `${batW}px`, height: `${bat.height}px`, objectFit: 'contain', flexShrink: 0, display: 'block' }} onError={(e) => { e.target.src = DEFAULT_BATTERY; }} />  
        </div>  
      );  
    };  
  
    function App() {  
      const [activeTab, setActiveTab] = useState('lock');   
      const [currentView, setCurrentView] = useState('lock');   
  
      const [wp, setWp] = useState({  
        lock: { url: DEFAULT_LOCK_WP, scale: 100, x: 0, y: 0 },  
        home: { url: DEFAULT_HOME_WP, scale: 100, x: 0, y: 0 }  
      });  
  
      const [timeFontWeight, setTimeFontWeight] = useState(100);  
      const [timeStretch, setTimeStretch] = useState(100);  
      const [lockTheme, setLockTheme] = useState('light');  
      const [homeTheme, setHomeTheme] = useState('light');  
      const [lockTopTheme, setLockTopTheme] = useState('light');  
      const [homeTopTheme, setHomeTopTheme] = useState('light');  
      const [bat, setBat] = useState({ height: 14.5, wifi: 17.5, signal: 14.5 });   
      const [flashlightOn, setFlashlightOn] = useState(false);  
      const [iconMap, setIconMap] = useState({});  
      const [toastMsg, setToastMsg] = useState('');  
      const [canvasBg, setCanvasBg] = useState('#f2f2f7');  
        
      const [isExporting, setIsExporting] = useState(false);  
      const [exportImage, setExportImage] = useState(null);  
      const [exportDimensions, setExportDimensions] = useState({ width: 750, height: 1000 });
      const [isBatchProcessing, setIsBatchProcessing] = useState(false);
      const [batchProgress, setBatchProgress] = useState({ current: 0, total: 0, message: '' });
        
      const [currentTime, setCurrentTime] = useState(new Date());  
      const screenRef = useRef(null);  
      const phoneWrapRef = useRef(null);  
      const doubleWrapRef = useRef(null);
      const toastTimer = useRef(null);  
  
      useEffect(() => {  
        if (!window.html2canvas) {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          script.async = true;
          document.body.appendChild(script);
        }  
          
        const timer = setInterval(() => setCurrentTime(new Date()), 10000);  
        return () => clearInterval(timer);  
      }, []);  
  
      const formatTime = (date) => {  
        let hours = date.getHours();  
        let minutes = date.getMinutes();  
        return `${hours < 10 ? '0'+hours : hours}:${minutes < 10 ? '0'+minutes : minutes}`;  
      };  
  
      const formatDate = (date) => {  
        const options = { weekday: 'long', month: 'long', day: 'numeric' };  
        return date.toLocaleDateString('en-US', options);  
      };  
  
      const showToast = (msg) => {  
        setToastMsg(msg);  
        if(toastTimer.current) clearTimeout(toastTimer.current);  
        toastTimer.current = setTimeout(() => setToastMsg(''), 1800);  
      };  
  
      const handleImageUpload = (e, target) => {  
        const file = e.target.files[0];  
        if (file) {  
          const reader = new FileReader();  
          reader.onload = (evt) => {  
            setWp(prev => ({ ...prev, [target]: { url: evt.target.result, scale: 100, x: 0, y: 0 } }));  
            showToast('壁纸已更新');  
          };  
          reader.readAsDataURL(file);  
        }  
      };  
  
      const handleWpChange = (target, field, value) => {  
        setWp(prev => ({  
          ...prev,  
          [target]: { ...prev[target], [field]: Number(value) }  
        }));  
      };  
  
      // --- 核心修复区：终极光栅化上传引擎 ---  
      const handleIconAssetsUpload = async (e) => {  
        const files = e.target.files;  
        if (!files.length) return;  
          
        showToast("正在通过光栅化引擎处理素材...");  
        const newMap = { ...iconMap };  
          
        const promises = Array.from(files).map(file => {  
          return new Promise((resolve) => {  
            const reader = new FileReader();  
            reader.onload = (evt) => {  
              const dataUrl = evt.target.result;  
                
              if (file.name.toLowerCase().endsWith('.svg') || file.type.includes('svg')) {  
                const img = new Image();  
                img.onload = () => {  
                  const canvas = document.createElement('canvas');  
                  const w = img.width || 300;  
                  const h = img.height || 150;  
                  canvas.width = w * 3; // 3倍超采样，确保视网膜级别清晰  
                  canvas.height = h * 3;  
                  const ctx = canvas.getContext('2d');  
                  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);  
                    
                  newMap[file.name] = canvas.toDataURL('image/png', 1.0);  
                  resolve();  
                };  
                img.onerror = () => {  
                  newMap[file.name] = dataUrl;  
                  resolve();  
                };  
                img.src = dataUrl;  
              } else {  
                newMap[file.name] = dataUrl;  
                resolve();  
              }  
            };  
            reader.readAsDataURL(file);  
          });  
        });  
          
        await Promise.all(promises);  
        setIconMap(newMap);  
        showToast(`成功处理并加载 ${files.length} 个安全图标`);  
      };  
  
      const generatePng = async (wrap, width, height) => {
        const originalCssText = wrap.style.cssText;
        try {
          wrap.style.cssText = `
            width: ${width}px !important;
            height: ${height}px !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 99999 !important;
            transform: none !important;
            background-color: ${canvasBg} !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 0 !important;
            opacity: 1 !important;
          `;
          await new Promise(resolve => setTimeout(resolve, 400));
          const canvas = await window.html2canvas(wrap, {
            backgroundColor: canvasBg,
            scale: 1,
            width: width,
            height: height,
            useCORS: true,
            allowTaint: true,
            logging: false,
          });
          const dataUrl = canvas.toDataURL('image/png', 1.0);
          // 立即释放 canvas 内存
          canvas.width = 1; canvas.height = 1;
          return dataUrl;
        } finally {
          wrap.style.cssText = originalCssText;
        }
      };

      const batchProcess = async () => {
        if (!window.html2canvas) {
          showToast("截图服务加载中，请稍候...");
          return;
        }

        const detectRegionLuminance = (blobUrl, yStart, yEnd) => new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            const sw = 120, sh = 60;
            const canvas = document.createElement('canvas');
            canvas.width = sw; canvas.height = sh;
            const ctx = canvas.getContext('2d');
            const srcY = img.height * yStart;
            const srcH = img.height * (yEnd - yStart);
            ctx.drawImage(img, 0, srcY, img.width, srcH, 0, 0, sw, sh);
            const d = ctx.getImageData(0, 0, sw, sh).data;
            let t = 0;
            for (let i = 0; i < d.length; i += 4)
              t += 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2];
            canvas.width = 1; canvas.height = 1; 
            resolve(t / (sw * sh));
          };
          img.onerror = () => resolve(128);
          img.src = blobUrl;
        });

        try {
          const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          
          let foldersToProcess = [];
          for await (const entry of dirHandle.values()) {
            if (entry.kind === 'directory' && entry.name !== '批量导出') {
              foldersToProcess.push(entry);
            }
          }

          if (foldersToProcess.length === 0) {
            showToast("未找到需要处理的文件夹！");
            return;
          }

          setIsBatchProcessing(true);
          setBatchProgress({ current: 0, total: foldersToProcess.length, message: '开始批量处理...' });

          const rootOutHandle = await dirHandle.getDirectoryHandle('批量导出', { create: true });

          const writePngNow = async (dataUrl, folderH, filename) => {
            const res = await fetch(dataUrl);
            const blob = await res.blob();
            const fh = await folderH.getFileHandle(filename, { create: true });
            const writable = await fh.createWritable();
            await writable.write(blob);
            await writable.close();
          };

          const writeDoneMarker = async (folderH) => {
            const fh = await folderH.getFileHandle('_done', { create: true });
            const writable = await fh.createWritable();
            await writable.write(new Blob([new Date().toISOString()]));
            await writable.close();
          };

          const isDone = async (parentH, name) => {
            try {
              const f = await parentH.getDirectoryHandle(name);
              await f.getFileHandle('_done');
              return true;
            } catch { return false; }
          };

          let skipped = 0;

          for (let i = 0; i < foldersToProcess.length; i++) {
            const folderHandle = foldersToProcess[i];
            const outFolderName = `${folderHandle.name}B`;

            if (await isDone(rootOutHandle, outFolderName)) {
              skipped++;
              setBatchProgress({
                current: i + 1,
                total: foldersToProcess.length,
                message: `⏭ 已跳过 ${skipped} 个 · 处理中: ${i + 1}/${foldersToProcess.length}`
              });
              await new Promise(r => setTimeout(r, 20));
              continue;
            }

            setBatchProgress({ current: i + 1, total: foldersToProcess.length, message: `正在处理: ${folderHandle.name}` });
            
            try {
              let lockEntry = null;
              let homeEntry = null;
              let allImages = [];

              for await (const entry of folderHandle.values()) {
                if (entry.kind === 'file' && entry.name.match(/\.(jpg|jpeg|png|webp|gif)$/i)) {
                  allImages.push(entry);
                  const baseName = entry.name.replace(/\.[^.]+$/, '');
                  if (baseName.endsWith('1')) lockEntry = entry;
                  else if (baseName.endsWith('2')) homeEntry = entry;
                }
              }

              if (!lockEntry && allImages.length > 0) lockEntry = allImages[0];
              if (!homeEntry && allImages.length > 1) homeEntry = allImages[1];
              else if (!homeEntry && lockEntry) homeEntry = lockEntry;

              if (!lockEntry) continue;

              const lockBlobUrl = URL.createObjectURL(await lockEntry.getFile());
              const homeBlobUrl = (lockEntry === homeEntry)
                ? lockBlobUrl
                : URL.createObjectURL(await homeEntry.getFile());

              const lockTopLum  = await detectRegionLuminance(lockBlobUrl, 0, 0.22);
              const lockBotLum  = await detectRegionLuminance(lockBlobUrl, 0.78, 1.0);
              const homeTopLum  = await detectRegionLuminance(homeBlobUrl, 0, 0.12);
              const homeBotLum  = await detectRegionLuminance(homeBlobUrl, 0.78, 1.0);
              setLockTopTheme(lockTopLum > 155 ? 'dark' : 'light');
              setLockTheme(lockBotLum > 155 ? 'dark' : 'light');
              setHomeTopTheme(homeTopLum > 155 ? 'dark' : 'light');
              setHomeTheme(homeBotLum > 155 ? 'dark' : 'light');

              const lockDims = await getImageDimensions(lockBlobUrl);
              const homeDims = await getImageDimensions(homeBlobUrl);

              setWp({
                lock: { url: lockBlobUrl, scale: calculateOptimalScale(lockDims.width, lockDims.height), x: 0, y: 0 },
                home: { url: homeBlobUrl, scale: calculateOptimalScale(homeDims.width, homeDims.height), x: 0, y: 0 }
              });

              await new Promise(r => setTimeout(r, 600));

              const outFolderHandle = await rootOutHandle.getDirectoryHandle(outFolderName, { create: true });

              // 截图 → 立即写盘 (增加等待时间至 550ms，确保透明度动画执行完毕)
              setCurrentView('lock');
              await new Promise(r => setTimeout(r, 550));
              await writePngNow(await generatePng(phoneWrapRef.current, 750, 1000), outFolderHandle, '锁屏.png');

              setCurrentView('home');
              await new Promise(r => setTimeout(r, 550));
              await writePngNow(await generatePng(phoneWrapRef.current, 750, 1000), outFolderHandle, '墙纸.png');

              await writePngNow(await generatePng(doubleWrapRef.current, 1000, 1000), outFolderHandle, '双排.png');

              await writeDoneMarker(outFolderHandle);

              URL.revokeObjectURL(lockBlobUrl);
              if (homeBlobUrl !== lockBlobUrl) URL.revokeObjectURL(homeBlobUrl);

              await new Promise(r => setTimeout(r, 600));

            } catch (itemErr) {
              console.error(`处理 ${folderHandle.name} 失败:`, itemErr);
              setBatchProgress(prev => ({ ...prev, message: `⚠️ 跳过出错项: ${folderHandle.name}` }));
              await new Promise(r => setTimeout(r, 400));
            }
          }
          
          setBatchProgress({ current: foldersToProcess.length, total: foldersToProcess.length, message: '批量处理完成！' });
          showToast("所有文件夹处理完毕！");
        } catch (error) {
          console.error("Batch processing failed or cancelled:", error);
          showToast("批量处理已取消或出错！");
        } finally {
          setIsBatchProcessing(false);
        }
      };

      const saveShot = async (isDouble = false) => {  
        if (!window.html2canvas) {
          showToast("截图服务加载中，请稍候...");
          return;
        }  
        if (isExporting) return;  
  
        setIsExporting(true);  
        await new Promise(r => setTimeout(r, 50));  
          
        const wrap = isDouble ? doubleWrapRef.current : phoneWrapRef.current;  
        const width = isDouble ? 1000 : 750;
        const height = 1000;

        setExportDimensions({ width, height });
  
        try {  
          const dataUrl = await generatePng(wrap, width, height);
            
          setExportImage(dataUrl);  
          showToast('生成成功！');  
            
          try {  
            const link = document.createElement('a');  
            link.download = `iOS26-Preview-${width}x${height}.png`;  
            link.href = dataUrl;  
            link.click();  
          } catch (err) {  
            console.log('自动下载被拦截');  
          }  
  
        } catch (err) {  
          console.error("截图或导出失败:", err);  
          showToast('截图失败，请确保导入了所有图片！');  
        } finally {  
          setIsExporting(false);  
        }  
      };  
  
      const AppIcon = ({ app, size = 70, theme = 'light' }) => {  
        const imgSrc = iconMap[app.img] || app.img;   
        return (  
          <div className="flex flex-col items-center gap-[5px] cursor-pointer active:scale-90 transition-transform" onClick={() => showToast(`打开 ${app.name}`)}>  
            <div   
              className="relative rounded-[17px] overflow-hidden flex-shrink-0"  
              style={{ width: size, height: size, backgroundColor: 'transparent' }}   
            >  
              {imgSrc && <img src={imgSrc} alt={app.name} className="absolute inset-0 w-full h-full object-cover z-0 block" onError={(e) => { e.target.src = TRANSPARENT_PIXEL; }} />}  
            </div>  
          </div>  
        );  
      };  

      // 修复重点：去除了外层和内部 flex 布局，全部使用绝对定位(absolute)，保证截图时坐标100%固定
      const renderLockScreenContent = (isVisible) => (
        <div

                {isBatchProcessing && (
                  <div className="mb-3">
                    <div className="text-[11px] text-[#8e8e93] flex justify-between mb-1">
                      <span>{batchProgress.message}</span>
                      <span>{batchProgress.current} / {batchProgress.total}</span>
                    </div>
                    <div className="w-full bg-[#e5e5ea] h-2 rounded-full overflow-hidden">
                      <div 
                        className="bg-[#007aff] h-full transition-all duration-300" 
                        style={{ width: `${(batchProgress.current / batchProgress.total) * 100}%` }}
                      ></div>
                    </div>
                  </div>
                )}

                <button   
                  onClick={batchProcess}   
                  disabled={isExporting || isBatchProcessing}   
                  className={`w-full py-3.5 rounded-[12px] text-[14px] font-semibold transition-all text-white ${isExporting || isBatchProcessing ? 'bg-[#c7c7cc] cursor-not-allowed' : 'bg-[#007aff] hover:bg-[#0066d6] active:scale-95'}`}  
                >  
                  {isBatchProcessing ? '🔄 批量处理中...' : '🚀 开始批量自动化生成'}  
                </button>
                  
                <div className="mt-4 text-[11px] text-[#8e8e93] leading-relaxed">  
                  * 本地脱机版可以直接抓取高分辨率画面。<br/>* 您已摆脱浏览器沙盒的安全限制。<br/>* 双击 HTML 即可无缝运行。  
                </div>  
              </div>  
            )}  
  
          </div>  
  
          <div className="relative flex-shrink-0" style={{ width: '488px', height: '650px' }}>  
            <div   
              id="phone-wrap-capture"  
              ref={phoneWrapRef}   
              className="flex items-center justify-center absolute top-0 left-0 transition-colors duration-300"  
              style={{   
                width: '750px',   
                height: '1000px',   
                transform: 'scale(0.65)',   
                transformOrigin: 'top left', 
                backgroundColor: canvasBg 
              }}  
            >  
              <div   
                ref={screenRef}   
                className="relative flex-shrink-0"  
                style={{  
                  width: '393px', height: '852px', borderRadius: '54px',  
                  boxShadow: `0 0 0 1.5px ${canvasBg}`, 
                  backgroundColor: canvasBg 
                }}  
              >  
  
                <div className="absolute inset-0 rounded-[54px] overflow-hidden">  
                    
                  <div className="absolute top-[12px] left-1/2 -translate-x-1/2 w-[118px] h-[34px] bg-black rounded-[20px] z-[150] transition-all cursor-pointer hover:w-[248px] hover:h-[62px] hover:rounded-[31px]">  
                    <div className="absolute right-[18px] top-1/2 -translate-y-1/2 w-[10px] h-[10px] rounded-full" style={{ background: 'radial-gradient(circle at 38% 32%, #121228, #000)', boxShadow: 'inset 0 0 0 2px #1a1a2a, 0 0 4px rgba(30,30,120,0.5)' }}></div>  
                  </div>  
  
                  {/* Lock Screen */}  
                  {renderLockScreenContent(currentView === 'lock')}
  
                  {/* Home Screen */}  
                  {renderHomeScreenContent(currentView === 'home')}
  
                </div>  
              </div>  
            </div>  

            {/* Hidden container for double export */}
            <div   
              id="double-wrap-capture"  
              ref={doubleWrapRef}   
              className="flex items-center justify-center absolute top-0 left-0 transition-colors duration-300 pointer-events-none"  
              style={{   
                width: '1000px',   
                height: '1000px',   
                transform: 'scale(0.001)',   
                transformOrigin: 'top left', 
                backgroundColor: canvasBg,
                opacity: 0,
                zIndex: -9999
              }}  
            >  
              <div className="flex gap-8 items-center justify-center">
                <div   
                  className="relative flex-shrink-0"  
                  style={{  
                    width: '393px', height: '852px', borderRadius: '54px',  
                    boxShadow: `0 0 0 1.5px ${canvasBg}, 0 20px 60px -10px rgba(0,0,0,0.15)`, 
                    backgroundColor: canvasBg 
                  }}  
                >  
                  <div className="absolute inset-0 rounded-[54px] overflow-hidden">  
                    <div className="absolute top-[12px] left-1/2 -translate-x-1/2 w-[118px] h-[34px] bg-black rounded-[20px] z-[150]">  
                      <div className="absolute right-[18px] top-1/2 -translate-y-1/2 w-[10px] h-[10px] rounded-full" style={{ background: 'radial-gradient(circle at 38% 32%, #121228, #000)', boxShadow: 'inset 0 0 0 2px #1a1a2a, 0 0 4px rgba(30,30,120,0.5)' }}></div>  
                    </div>  
                    {renderLockScreenContent(true)}
                  </div>  
                </div>  

                <div   
                  className="relative flex-shrink-0"  
                  style={{  
                    width: '393px', height: '852px', borderRadius: '54px',  
                    boxShadow: `0 0 0 1.5px ${canvasBg}, 0 20px 60px -10px rgba(0,0,0,0.15)`, 
                    backgroundColor: canvasBg 
                  }}  
                >  
                  <div className="absolute inset-0 rounded-[54px] overflow-hidden">  
                    <div className="absolute top-[12px] left-1/2 -translate-x-1/2 w-[118px] h-[34px] bg-black rounded-[20px] z-[150]">  
                      <div className="absolute right-[18px] top-1/2 -translate-y-1/2 w-[10px] h-[10px] rounded-full" style={{ background: 'radial-gradient(circle at 38% 32%, #121228, #000)', boxShadow: 'inset 0 0 0 2px #1a1a2a, 0 0 4px rgba(30,30,120,0.5)' }}></div>  
                    </div>  
                    {renderHomeScreenContent(true)}
                  </div>  
                </div>  
              </div>
            </div>  
          </div>  
  
          <div   
            className="fixed bottom-[28px] left-1/2 -translate-x-1/2 bg-[#1c1c1e] text-white px-4 py-[9px] rounded-[11px] text-[13px] z-[9999] pointer-events-none whitespace-nowrap border-[0.5px] border-[#3a3a3c] transition-all duration-200"  
            style={{  
              opacity: toastMsg ? 1 : 0,  
              transform: `translateX(-50%) translateY(${toastMsg ? '0' : '10px'})`  
            }}  
          >  
            {toastMsg}  
          </div>  
        </div>  
      );  
    }  
  
    const root = ReactDOM.createRoot(document.getElementById('root'));  
    root.render(<App />);  
  </script>  
</body>  
</html>
