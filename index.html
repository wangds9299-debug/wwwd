<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI作图工具 - 设计师专版</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #3b82f6;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [apiKey, setApiKey] = useState(localStorage.getItem('ai_api_key') || '');
      const [prompt, setPrompt] = useState('');
      const [size, setSize] = useState('1K');
      const [aspectRatio, setAspectRatio] = useState('auto');
      const [urlsText, setUrlsText] = useState('');
      
      const [status, setStatus] = useState('idle'); // idle, submitting, polling, success, error
      const [errorMsg, setErrorMsg] = useState('');
      const [taskId, setTaskId] = useState('');
      const [resultImage, setResultImage] = useState('');
      const [progressMsg, setProgressMsg] = useState('');

      useEffect(() => {
        localStorage.setItem('ai_api_key', apiKey);
      }, [apiKey]);

      const pollStatus = async (id) => {
        try {
          const res = await fetch(`https://api.wuyinkeji.com/api/async/detail?key=${encodeURIComponent(apiKey)}&id=${encodeURIComponent(id)}`);
          const data = await res.json();

          console.log("Detail API response:", data);
          
          if (data.code !== 200) {
            if (data.code === 403) {
              throw new Error("密钥错误或已失效");
            }
            throw new Error(data.msg || "获取任务状态失败");
          }

          const taskData = data.data;
          if (!taskData) {
            throw new Error("返回数据异常：找不到data");
          }

          // 尝试根据常见状态判断
          // 假设：status = 'success', 'processing', 'failed' 等
          // 由于没有完整的文档，我们尽量兼容各种情况
          const statusVal = String(taskData.status || taskData.state || '').toLowerCase();

          if (statusVal === 'success' || statusVal === 'succeeded' || statusVal === 'completed' || taskData.url || taskData.image || (taskData.images && taskData.images.length > 0)) {
            setStatus('success');
            // 提取图片
            let finalUrl = taskData.url || taskData.image || '';
            if (!finalUrl && taskData.images && taskData.images.length > 0) {
              finalUrl = taskData.images[0];
            }
            if (!finalUrl && typeof taskData === 'string' && taskData.startsWith('http')) {
              finalUrl = taskData;
            }
            
            // 兜底方案：如果找不到，将整个对象转成字符串让用户看
            if (!finalUrl) {
              finalUrl = JSON.stringify(taskData);
            }

            setResultImage(finalUrl);
            setProgressMsg('生成成功！');
          } else if (statusVal === 'failed' || statusVal === 'error') {
            setStatus('error');
            setErrorMsg(`生成失败: ${taskData.reason || taskData.error || '未知错误'}`);
          } else {
            // 继续轮询
            setProgressMsg(`生成中... (状态: ${statusVal || '处理中'})`);
            setTimeout(() => pollStatus(id), 3000);
          }

        } catch (err) {
          console.error("Polling error:", err);
          setStatus('error');
          setErrorMsg(err.message || "请求异常");
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!apiKey.trim()) {
          setErrorMsg('请输入API密钥');
          return;
        }
        if (!prompt.trim()) {
          setErrorMsg('请输入提示词');
          return;
        }

        setStatus('submitting');
        setErrorMsg('');
        setResultImage('');
        setTaskId('');
        setProgressMsg('提交任务中...');

        const urls = urlsText.split('\n').map(u => u.trim()).filter(u => u);

        const payload = {
          prompt,
          size,
          aspectRatio
        };
        if (urls.length > 0) {
          payload.urls = urls;
        }

        try {
          const res = await fetch(`https://api.wuyinkeji.com/api/async/image_nanoBanana2?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          console.log("Submit API response:", data);

          if (data.code !== 200) {
            throw new Error(data.msg || "提交失败");
          }

          if (data.data && data.data.id) {
            const id = data.data.id;
            setTaskId(id);
            setStatus('polling');
            setProgressMsg('任务已提交，排队生成中...');
            setTimeout(() => pollStatus(id), 3000);
          } else {
            throw new Error("返回数据缺失任务ID");
          }

        } catch (err) {
          console.error("Submit error:", err);
          setStatus('error');
          setErrorMsg(err.message || "请求异常");
        }
      };

      return (
        <div className="flex h-screen overflow-hidden bg-gray-100">
          {/* 左侧控制面板 */}
          <div className="w-80 bg-white shadow-xl flex flex-col z-10">
            <div className="p-5 border-b border-gray-200">
              <h1 className="text-xl font-bold text-gray-800 flex items-center">
                <svg className="w-6 h-6 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                AI作图 - 设计师专版
              </h1>
            </div>
            
            <div className="flex-1 overflow-y-auto p-5">
              <form onSubmit={handleSubmit} className="space-y-4">

                {/* 密钥 */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">API 密钥 <span className="text-red-500">*</span></label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="请输入你的API密钥"
                  />
                </div>

                {/* 提示词 */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">提示词 (Prompt) <span className="text-red-500">*</span></label>
                  <textarea
                    value={prompt}
                    onChange={(e) => setPrompt(e.target.value)}
                    rows={4}
                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"
                    placeholder="描述你想要的画面，如：一只赛博朋克风格的可爱猫咪，高清晰度，细节丰富..."
                  />
                </div>

                {/* 输出尺寸 */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">图像大小 (Size)</label>
                  <select
                    value={size}
                    onChange={(e) => setSize(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                  >
                    <option value="1K">1K (默认)</option>
                    <option value="2K">2K</option>
                    <option value="4K">4K (生成时间较长)</option>
                  </select>
                </div>

                {/* 比例 */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">图像比例 (Aspect Ratio)</label>
                  <select
                    value={aspectRatio}
                    onChange={(e) => setAspectRatio(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                  >
                    <option value="auto">auto (默认)</option>
                    <option value="1:1">1:1 (头像/方图)</option>
                    <option value="16:9">16:9 (横屏/桌面)</option>
                    <option value="9:16">9:16 (竖屏/手机)</option>
                    <option value="4:3">4:3</option>
                    <option value="3:4">3:4</option>
                    <option value="3:2">3:2</option>
                    <option value="2:3">2:3</option>
                    <option value="5:4">5:4</option>
                    <option value="4:5">4:5</option>
                    <option value="21:9">21:9 (带鱼屏)</option>
                  </select>
                </div>

                {/* 参考图 */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">参考图 (URLs) - 每行一个</label>
                  <textarea
                    value={urlsText}
                    onChange={(e) => setUrlsText(e.target.value)}
                    rows={3}
                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"
                    placeholder="https://example.com/img1.jpg&#10;https://example.com/img2.jpg"
                  />
                </div>

                <div className="pt-2">
                  <button
                    type="submit"
                    disabled={status === 'submitting' || status === 'polling'}
                    className={`w-full py-2.5 px-4 rounded-md text-white font-medium transition-colors ${
                      (status === 'submitting' || status === 'polling')
                        ? 'bg-blue-400 cursor-not-allowed'
                        : 'bg-blue-600 hover:bg-blue-700 active:bg-blue-800'
                    }`}
                  >
                    {status === 'submitting' ? '提交请求中...' : status === 'polling' ? '生成中...' : '开始生成'}
                  </button>
                </div>

              </form>
            </div>
          </div>

          {/* 右侧展示区域 */}
          <div className="flex-1 flex flex-col relative">
            <div className="p-4 bg-white border-b border-gray-200 flex justify-between items-center shadow-sm z-10">
              <h2 className="text-lg font-medium text-gray-700">实时预览</h2>
              <div className="text-sm text-gray-500">
                {taskId && <span>Task ID: <span className="font-mono text-xs">{taskId}</span></span>}
              </div>
            </div>

            <div className="flex-1 overflow-auto p-8 flex items-center justify-center bg-gray-50 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iI2ZmZiIvPgo8Y2lyY2xlIGN4PSIyIiBjeT0iMiIgcj0iMSIgZmlsbD0iI2U1ZTdlYiIvPgo8L3N2Zz4=')]">
              
              {status === 'idle' && (
                <div className="text-center text-gray-400 flex flex-col items-center">
                  <svg className="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                  <p>填写参数并点击生成开始作图</p>
                </div>
              )}

              {(status === 'submitting' || status === 'polling') && (
                <div className="text-center flex flex-col items-center">
                  <div className="spinner mb-4"></div>
                  <h3 className="text-lg font-medium text-gray-800">{progressMsg}</h3>
                  <p className="text-sm text-gray-500 mt-2">AI正在挥洒创意，请耐心等待...</p>
                </div>
              )}

              {status === 'error' && (
                <div className="bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-lg max-w-lg shadow-sm">
                  <h3 className="text-lg font-bold mb-2 flex items-center">
                    <svg className="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd"></path>
                    </svg>
                    请求失败
                  </h3>
                  <p className="text-sm break-all">{errorMsg}</p>
                </div>
              )}

              {status === 'success' && resultImage && (
                <div className="flex flex-col items-center w-full max-w-4xl animate-fade-in">
                  <div className="bg-white p-2 shadow-lg rounded-xl mb-6 w-full max-w-full">
                    {resultImage.startsWith('http') || resultImage.startsWith('data:') ? (
                      <img
                        src={resultImage}
                        alt="Generated Result"
                        className="w-full h-auto object-contain max-h-[70vh] rounded-lg"
                      />
                    ) : (
                      <div className="p-4 bg-gray-100 rounded-lg whitespace-pre-wrap overflow-auto max-h-[70vh] text-xs font-mono">
                        {resultImage}
                      </div>
                    )}
                  </div>
                  
                  {/* 下载或操作栏 */}
                  <div className="flex gap-4">
                    {resultImage.startsWith('http') || resultImage.startsWith('data:') ? (
                      <a
                        href={resultImage}
                        target="_blank"
                        rel="noreferrer"
                        className="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-full shadow-md hover:bg-blue-700 transition-colors flex items-center"
                      >
                        <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        在新标签页打开 / 保存原图
                      </a>
                    ) : null}
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
